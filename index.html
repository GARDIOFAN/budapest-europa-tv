<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bp Európa Televízió Budapest online TV adás</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .page-container {
            width: 980px;
            margin: 0 auto;
            background-color: #111111;
            border: 1px solid #333;
        }

        .info-bar {
            background-color: #222222;
            color: #cccccc;
            padding: 8px 15px;
            font-size: 12px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid #444;
        }

        .header-logo-area {
            background: linear-gradient(180deg, #1a0000 0%, #4a0000 100%);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #880000;
            position: relative;
        }
        
        .bpetv-official-logo {
            display: inline-block;
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            color: #ffffff;
            text-shadow: 3px 3px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            background: #990000;
            padding: 10px 25px;
            border: 3px solid #ffffff;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        .bpetv-official-logo .yellow-text {
            color: #ffff00;
        }
        .bpetv-subtext {
            color: #ffffff;
            font-size: 14px;
            margin-top: 8px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu-bar {
            background-color: #880000;
            overflow: hidden;
            border-bottom: 2px solid #550000;
            display: flex;
        }
        .menu-bar button {
            background: none;
            border: none;
            border-right: 1px solid #aa2222;
            color: white;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-bar button:hover, .menu-bar button.active {
            background-color: #bb0000;
        }

        .content-area {
            padding: 25px;
            text-align: center;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .video-container {
            position: relative;
            width: 800px;
            height: 450px;
            margin: 0 auto;
            background-color: #000000;
            border: 2px solid #444444;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        #idleCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        #tvPlayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
        }

        .player-corner-logo-img {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 110px;
            height: auto;
            pointer-events: none;
            z-index: 10;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8));
            opacity: 0.9;
        }

        .empty-archive {
            background-color: #1a1a1a;
            border: 1px dashed #444;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 6px;
            color: #888;
            font-size: 16px;
        }

        .footer {
            background-color: #050505;
            color: #777777;
            font-size: 11px;
            text-align: center;
            padding: 15px;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

<div class="page-container">

    <div class="info-bar">
        <div>BP EURÓPA TELEVÍZIÓ Budapest</div>
    </div>

    <div class="header-logo-area">
        <div class="bpetv-official-logo">
            BP <span class="yellow-text">EURÓPA</span> TV
        </div>
        <div class="bpetv-subtext">Budapest Online Televízió Adás</div>
    </div>

    <div class="menu-bar">
        <button class="active" onclick="switchTab('live-tab', this)">ÉLŐ ADÁS</button>
        <button onclick="switchTab('archive-tab', this)">ARCHÍVUM</button>
    </div>

    <div class="content-area">

        <div id="live-tab" class="tab-content active">
            <h3 style="color: #ff3333; margin-top: 0;">Bp Európa Televízió Budapest online TV adás</h3>
            
            <div class="video-container">
                <canvas id="idleCanvas" width="800" height="450"></canvas>
                <video id="tvPlayer" playsinline muted autoplay></video>
                <img src="logo.png" alt="BPETV Logo" class="player-corner-logo-img">
            </div>
        </div>

        <div id="archive-tab" class="tab-content">
            <h3 style="color: #ff3333; margin-top: 0;">Korábbi Műsorok / Archívum</h3>
            
            <div class="empty-archive">
                📁 Jelenleg nincsenek elérhető műsorok az archívumban.
            </div>
        </div>

    </div>

    <div class="footer">
        Budapest Roleplay 2026. - Minden jog fenntartva - Copyright - www.BPTV.hu
    </div>

</div>

<script>
    const canvas = document.getElementById('idleCanvas');
    const ctx = canvas.getContext('2d');
    const player = document.getElementById('tvPlayer');

    let isLiveActive = false;

    function drawPM5544() {
        if (isLiveActive) return;

        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const radius = 210;

        ctx.fillStyle = "#666666";
        ctx.fillRect(0, 0, w, h);

        const cols = 16;
        const rows = 12;
        const cw = w / cols;
        const ch = h / rows;

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;

        for (let i = 0; i <= cols; i++) {
            ctx.beginPath();
            ctx.moveTo(i * cw, 0);
            ctx.lineTo(i * cw, h);
            ctx.stroke();
        }
        for (let j = 0; j <= rows; j++) {
            ctx.beginPath();
            ctx.moveTo(0, j * ch);
            ctx.lineTo(w, j * ch);
            ctx.stroke();
        }

        for (let i = 0; i < cols; i++) {
            ctx.fillStyle = (i % 2 === 0) ? "#ffffff" : "#000000";
            ctx.fillRect(i * cw, 0, cw, 12);
            ctx.fillRect(i * cw, h - 12, cw, 12);
        }
        for (let j = 0; j < rows; j++) {
            ctx.fillStyle = (j % 2 === 0) ? "#ffffff" : "#000000";
            ctx.fillRect(0, j * ch, 12, ch);
            ctx.fillRect(w - 12, j * ch, 12, ch);
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.clip();

        ctx.fillStyle = "#888888";
        ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

        ctx.fillStyle = "#000000";
        ctx.fillRect(cx - radius, cy - 170, radius * 2, 40);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(cx - radius, cy - 130, radius * 2, 20);

        const colors = ["#ffff00", "#00ffff", "#00ff00", "#ff00ff", "#ff0000", "#0000ff"];
        const barW = (radius * 2) / colors.length;
        for (let i = 0; i < colors.length; i++) {
            ctx.fillStyle = colors[i];
            ctx.fillRect(cx - radius + (i * barW), cy - 110, barW, 60);
        }

        ctx.fillStyle = "#000000";
        ctx.fillRect(cx - radius, cy - 50, radius * 2, 100);

        const grays = ["#ffffff", "#cccccc", "#999999", "#666666", "#333333", "#000000"];
        const grayW = (radius * 2) / grays.length;
        for (let i = 0; i < grays.length; i++) {
            ctx.fillStyle = grays[i];
            ctx.fillRect(cx - radius + (i * grayW), cy + 50, grayW, 50);
        }

        ctx.fillStyle = "#ff0000";
        ctx.fillRect(cx - 20, cy + 100, 40, 70);
        ctx.fillStyle = "#ffff00";
        ctx.fillRect(cx - radius, cy + 100, radius - 20, 70);
        ctx.fillRect(cx + 20, cy + 100, radius - 20, 70);

        ctx.fillStyle = "#000000";
        ctx.fillRect(cx - 100, cy - 160, 200, 32);
        ctx.strokeStyle = "#ffffff";
        ctx.strokeRect(cx - 100, cy - 160, 200, 32);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText("BP EURÓPA TV", cx, cy - 138);

        ctx.fillStyle = "#000000";
        ctx.fillRect(cx - 100, cy + 120, 200, 32);
        ctx.strokeRect(cx - 100, cy + 120, 200, 32);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px 'Courier New', monospace";
        ctx.fillText("BUDAPEST", cx, cy + 142);

        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const dateStr = `${yy}-${mm}-${dd}`;

        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        const timeStr = `${hh}:${min}:${ss}`;

        ctx.fillStyle = "#000000";
        ctx.fillRect(cx - 140, cy - 15, 110, 30);
        ctx.strokeRect(cx - 140, cy - 15, 110, 30);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px 'Courier New', monospace";
        ctx.fillText(dateStr, cx - 85, cy + 5);

        ctx.fillStyle = "#000000";
        ctx.fillRect(cx + 30, cy - 15, 110, 30);
        ctx.strokeRect(cx + 30, cy - 15, 110, 30);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px 'Courier New', monospace";
        ctx.fillText(timeStr, cx + 85, cy + 5);

        ctx.fillStyle = "#000000";
        ctx.fillRect(cx - 10, cy - 25, 8, 50);
        ctx.fillRect(cx + 2, cy - 25, 8, 50);

        ctx.restore();

        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        requestAnimationFrame(drawPM5544);
    }

    function checkLiveFeed() {
        fetch('adas.mp4', { method: 'HEAD' })
            .then(response => {
                if (response.ok) {
                    if (!isLiveActive) {
                        startLiveShow('adas.mp4');
                    }
                } else {
                    switchToFallback();
                }
            })
            .catch(() => {
                switchToFallback();
            });
    }

    function startLiveShow(src) {
        isLiveActive = true;
        canvas.style.display = 'none';
        player.style.display = 'block';
        if (player.src !== window.location.href + src) {
            player.src = src;
        }
        player.controls = true;
        player.muted = false;
        
        let playPromise = player.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                player.muted = true;
                player.play();
            });
        }
    }

    function switchToFallback() {
        isLiveActive = false;
        player.pause();
        player.style.display = 'none';
        canvas.style.display = 'block';
        drawPM5544();
    }

    checkLiveFeed();
    setInterval(checkLiveFeed, 5000);

    drawPM5544();

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.menu-bar button').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }
</script>

</body>
</html>
